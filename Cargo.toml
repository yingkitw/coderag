[workspace]
resolver = "2"
members = ["crates/coderag", "crates/coderag-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/coderag"
rust-version = "1.85"

[workspace.dependencies]
coderag = { path = "crates/coderag", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
notify = "8"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23.2"

[profile.release]
lto = "thin"
strip = "symbols"
